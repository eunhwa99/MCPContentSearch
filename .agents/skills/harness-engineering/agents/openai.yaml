interface:
  display_name: "Harness Engineering"
  short_description: "Orchestrate context-zip harness phases"
  default_prompt: "$harness-engineering를 사용해 먼저 plan-exempt 여부를 결정하고, feature/behavior 변경이면 unit/integration/deterministic E2E RED 증거를 production edit 전에 기록한 뒤 GREEN, refactor, ./scripts/verify_all.sh, matching eval(해당 시), improvement after/delta(improvement-scoped), smoke 순서로 진행하세요. Pure refactor/test-only/non-behavior 변경은 RED n/a 사유를 기록합니다. Improvement-scoped 작업은 production edit 전 baseline(temp Chroma/SQLite + mocked connectors; never inspect/mutate user data without approval+plan)과 이후 최신 applicable gate 이후 한 번의 after/delta 표(temp Chroma/SQLite + mocked connectors; never inspect/mutate user data without approval+plan)를 기록하고, 해당 없으면 n/a 사유를 남기세요. Review gate는 정확히 3명의 fresh read-only reviewer를 bugs/correctness, security/data safety, performance/reliability 렌즈로 각각 다르게 프롬프팅합니다."
