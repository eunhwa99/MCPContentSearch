name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Python 3.13 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.5"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check lockfile
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --locked --python 3.13 --dev

      - name: Compile retained Python modules
        run: uv run --locked python -m compileall api core environments fetching indexing search storage main.py

      - name: Run Ruff lint
        run: uv run --locked ruff check api core environments fetching indexing search storage main.py

      - name: Run scoped mypy
        run: uv run --locked mypy

      - name: Run scoped Bandit
        run: |
          uv run --locked bandit \
            -q \
            -c pyproject.toml \
            -r api core environments fetching indexing search storage main.py \
            --severity-level medium \
            --confidence-level low

      - name: Run public MCP contract tests
        env:
          IS_TESTING: "1"
        run: |
          uv run --locked pytest -q \
            tests/contracts/test_public_mcp_contracts.py \
            tests/test_app_composition.py

      - name: Run non-live tests with coverage
        env:
          IS_TESTING: "1"
        run: |
          uv run --locked pytest -m "not live" \
            --cov=api \
            --cov=core \
            --cov=environments \
            --cov=fetching \
            --cov=indexing \
            --cov=search \
            --cov=storage \
            --cov-report=term-missing

      - name: Run deterministic ContextZip evals
        run: |
          uv run --locked python scripts/run_context_zip_eval.py \
            --output-dir artifacts/context-zip-evals

      - name: Upload ContextZip eval artifacts
        if: ${{ always() && hashFiles('artifacts/context-zip-evals/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: context-zip-evals
          path: artifacts/context-zip-evals
          if-no-files-found: warn

      - name: Run functional E2E gate
        env:
          IS_TESTING: "1"
        run: ./scripts/verify_functional_e2e.sh
